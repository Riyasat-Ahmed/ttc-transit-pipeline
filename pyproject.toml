[project]
name = "ttc-pipeline"
version = "0.1.0"
description = "Streaming pipeline that measures how late TTC buses and streetcars run"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.6",
    "gtfs-realtime-bindings>=1.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
analysis = ["pandas>=2.2", "matplotlib>=3.9"]

[project.scripts]
ttc = "ttc.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running TimescaleDB (DATABASE_URL)"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_dashboard.py" = ["E501"]  # embedded SQL
