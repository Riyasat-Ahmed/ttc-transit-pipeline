name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: ttc
          POSTGRES_PASSWORD: ttc
          POSTGRES_DB: ttc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttc" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ttc:ttc@localhost:5432/ttc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -v
      - name: Dashboard JSON is up to date
        run: uv run python scripts/build_dashboard.py && git diff --exit-code grafana/dashboards/ttc.json
